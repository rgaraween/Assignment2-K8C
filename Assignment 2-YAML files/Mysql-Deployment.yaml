
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: assignment2
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: 860572194478.dkr.ecr.us-east-1.amazonaws.com/assignment2-ecr-mysql:v0.1
          ports:
            - containerPort: 3306     # MySQL listens on port 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "pw"
      imagePullSecrets:
        - name: regcred
