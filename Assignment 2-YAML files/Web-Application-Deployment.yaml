
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: assignment2
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: employees
  template:
    metadata:
      labels:
        app: employees
    spec:
      containers:
        - name: web
          image: 860572194478.dkr.ecr.us-east-1.amazonaws.com/assignment2-ecr-app:v0.1
          ports:
            - containerPort: 8080       # The web app listens on port 8080
          env:
            - name: DBHOST
              value: "mysql-service"
            - name: DBPORT
              value: "3306"
            - name: DBUSER
              value: "root"
            - name: DBPWD
              value: "pw"
      imagePullSecrets:
        - name: regcred
